lor:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.input,.select{background:#fff;border:1px solid #dfe4e0;border-radius:9px;padding:10px 11px;font-family:inherit;font-size:12px;outline:0}.input:focus,.select:focus{border-color:#91bda7;box-shadow:0 0 0 3px #edf6f0}.search{flex:1;min-width:210px}.page{display:none}.page.active{display:block}.statline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:12px}.statline:last-child{border:0}.modal{display:none;position:fixed;inset:0;background:#1016128a;z-index:50;align-items:center;justify-content:center;padding:20px}.modal.show{display:flex}.modal-box{background:#fff;width:min(690px,100%);max-height:92vh;overflow:auto;border-radius:16px;padding:22px}.modal-box h2{font-family:Manrope;margin:0;font-size:19px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:17px}.form label{font-size:11px;color:#66716b;font-weight:700}.form input,.form select{width:100%;margin-top:6px;padding:10px;border:1px solid #dfe4e0;border-radius:9px;font:inherit;font-size:12px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.pos{display:grid;grid-template-columns:1.35fr .7fr;gap:14px}.products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-height:570px;overflow:auto}.prod-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;cursor:pointer;transition:.16s}.prod-card:hover{border-color:#9dc6b0;transform:translateY(-1px)}.prod-cat{font-size:9px;color:var(--muted);margin-top:3px}.price{font-family:Manrope;font-size:13px;font-weight:800;margin-top:8px}.cart{position:sticky;top:18px}.cart-row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:11px}.qty{display:flex;gap:4px;align-items:center}.qty button{border:0;background:#eef2ef;border-radius:6px;width:23px;height:23px;padding:0;cursor:pointer}.total-row{display:flex;justify-content:space-between;padding-top:15px;font-family:Manrope;font-size:17px;font-weight:800}.notice{padding:11px 12px;background:#fff7e7;color:#89611f;border-radius:9px;font-size:11px;margin-bottom:12px}.hidden{display:none!important}.footer{font-size:10px;color:#98a09b;margin-top:14px}.mobile-hide{display:block}

const KEY="grocerify_manager_v2";let db=JSON.parse(localStorage.getItem(KEY)||"null")||{products:[],sales:[],customers:[],expenses:[]};let cart=[];
let imageCache={},imageDB=null;
function initImageDB(){return new Promise(resolve=>{try{const r=indexedDB.open("grocerify_images_v1",1);r.onupgradeneeded=()=>r.result.createObjectStore("images");r.onsuccess=()=>{imageDB=r.result;resolve()};r.onerror=()=>resolve()}catch(e){resolve()}})}
function getStoredImage(id){return new Promise(resolve=>{if(imageCache[id])return resolve(imageCache[id]);if(!imageDB)return resolve("");try{const r=imageDB.transaction("images","readonly").objectStore("images").get(id);r.onsuccess=()=>{imageCache[id]=r.result||"";resolve(imageCache[id])};r.onerror=()=>resolve("")}catch(e){resolve("")}})}
function saveStoredImage(id,data){imageCache[id]=data;if(imageDB)try{imageDB.transaction("images","readwrite").objectStore("images").put(data,id)}catch(e){}}
function deleteStoredImage(id){delete imageCache[id];if(imageDB)try{imageDB.transaction("images","readwrite").objectStore("images").delete(id)}catch(e){}}
function fileToDataURL(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}
function productImage(p){return imageCache[p.id]||p.image||""}
async function hydrateImages(){if(!imageDB)return;for(const p of db.products){const v=await getStoredImage(p.id);if(v)imageCache[p.id]=v}}

// Import the website catalog without overwriting stock, purchase cost or product IDs.
function loadCatalog(showMessage=true){
  if(!Array.isArray(db.products)) db.products=[];
  let added=0,updated=0;
  const norm=v=>String(v||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  for(const item of CATALOG){
    // Match by exact normalized product name + category, never by shared image.
    let old=db.products.find(p=>norm(p.name)===norm(item.name) && norm(p.cat)===norm(item.cat));
    if(old){
      old.name=item.name; old.cat=item.cat; old.sell=Number(item.sell)||Number(old.sell)||0;
      old.image=item.image||old.image; old.unit=old.unit||item.unit||"pcs";
      old.variants=Array.isArray(item.variants)?item.variants:(old.variants||[]);
      old.note=item.note||old.note||"";
      if(!Number.isFinite(Number(old.qty))) old.qty=0;
      if(!Number.isFinite(Number(old.buy))) old.buy=0;
      if(!old.min) old.min=Number(item.min)||5;
      updated++;
    }else{
      {const {sheet,...rest}=item;db.products.push({...rest,id:crypto.randomUUID(),qty:0,buy:0})}
      added++;
    }
  }
  save();
  if(showMessage) alert(`Website catalog imported.\n${added} products added; ${updated} existing products updated.\nYour existing stock quantities and purchase costs were preserved.`);
}
function money(n){return"Rs. "+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2})}function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function product(id){return db.products.find(p=>p.id===id)}function days(d){return d?Math.ceil((new Date(d)-new Date())/86400000):99999}function exp(d){let x=days(d);if(!d)return'<span class="badge neutral">No date</span>';if(x<0)return'<span class="badge bad">Expired</span>';if(x<=7)return'<span class="badge bad">≤ 7 days</span>';if(x<=30)return'<span class="badge warn">≤ 30 days</span>';return'<span class="badge good">Good</span>'}function stats(){let rev=db.sales.reduce((a,s)=>a+s.qty*s.sell,0),cost=db.sales.reduce((a,s)=>a+s.qty*s.buy,0),ex=db.expenses.reduce((a,e)=>a+e.amount,0);return{rev,cost,ex,profit:rev-cost-ex,stock:db.products.reduce((a,p)=>a+p.qty*p.buy,0),low:db.products.filter(p=>p.qty<=p.min).length,expiry:db.products.filter(p=>days(p.expiry)<=30).length}}
function save(){localStorage.setItem(KEY,JSON.stringify(db));renderAll()}function showPage(id,btn){document.querySelectorAll(".page").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));if(btn)btn.classList.add("active");document.getElementById("pageTitle").textContent={dashboard:"Dashboard",pos:"Point of Sale",inventory:"Inventory",sales:"Sales History",customers:"Customers & Due",reports:"Reports",settings:"Settings & Backup"}[id];renderAll()}
function renderAll(){dashboard();inventory();sales();customers();reports();settings();pos()}
function dashboard(){let s=stats(),recent=db.sales.slice(-6).reverse(),low=db.products.filter(p=>p.qty<=p.min),ex=db.products.filter(p=>days(p.expiry)<=30);document.getElementById("dashboard").innerHTML=`<div class="kpis"><div class="kpi"><div class="kpi-top">Stock value <span class="kpi-icon">□</span></div><strong>${money(s.stock)}</strong><div class="muted">Purchase value</div></div><div class="kpi"><div class="kpi-top">Sales revenue <span class="kpi-icon">↗</span></div><strong>${money(s.rev)}</strong><div class="muted">Recorded transactions</div></div><div class="kpi"><div class="kpi-top">Net profit / loss <span class="kpi-icon">+</span></div><strong class="${s.profit>=0?'positive':'negative'}">${money(s.profit)}</strong><div class="muted">After expenses</div></div><div class="kpi"><div class="kpi-top">Inventory alerts <span class="kpi-icon">!</span></div><strong>${s.low+s.expiry}</strong><div class="muted">${s.low} low stock · ${s.expiry} expiry</div></div></div><div class="content-grid"><div class="panel"><div class="panel-head"><h2>Recent sales</h2><button class="btn soft" onclick="showPage('sales')">View all</button></div><div class="table-wrap"><table><tr><th>Product</th><th>Date</th><th>Qty</th><th>Amount</th></tr>${recent.map(x=>`<tr><td><div class="product-name">${esc(product(x.pid)?.name||x.name||"Old product (removed)")}</div><div class="sub">${esc(x.method)}</div></td><td>${new Date(x.date).toLocaleDateString()}</td><td>${x.qty}</td><td>${money(x.qty*x.sell)}</td></tr>`).join("")||'<tr><td colspan="4" class="empty">No sales recorded yet.</td></tr>'}</table></div></div><div class="panel"><div class="panel-head"><h2>Needs attention</h2><button class="btn soft" onclick="showPage('inventory')">Inventory</button></div>${low.slice(0,4).map(p=>`<div class="alert"><div><b>${esc(p.name)}</b><div class="sub">${p.qty} ${p.unit} remaining · minimum ${p.min}</div></div><span class="badge bad">Low stock</span></div>`).join("")}${ex.slice(0,4).map(p=>`<div class="alert"><div><b>${esc(p.name)}</b><div class="sub">Expiry ${p.expiry}</div></div>${exp(p.expiry)}</div>`).join("")}${!low.length&&!ex.length?'<div class="empty">No alerts right now.</div>':''}</div></div>`}
function pcalc(p){const q=+p.qty||0,b=+p.buy||0,s=+p.sell||0,has=b>0;return{has,unit:s-b,pct:has&&s>0?(s-b)/s*100:0,val:q*b,retail:q*s,pot:has?q*(s-b):0}}
function invKpis(){const t=db.products.reduce((a,p)=>{const c=pcalc(p);a.val+=c.val;a.retail+=c.retail;a.pot+=c.pot;if((+p.qty||0)<=(+p.min||0))a.low++;if(!c.has)a.nocp++;return a},{val:0,retail:0,pot:0,low:0,nocp:0});return`<div class="kpi"><div class="kpi-top">Stock value (CP)</div><strong>${money(t.val)}</strong><div class="muted">What your stock cost</div></div><div class="kpi"><div class="kpi-top">Stock value (SP)</div><strong>${money(t.retail)}</strong><div class="muted">If all sold at SP</div></div><div class="kpi"><div class="kpi-top">Potential profit</div><strong class="${t.pot>=0?'positive':'negative'}">${money(t.pot)}</strong><div class="muted">${t.nocp} products still need CP</div></div><div class="kpi"><div class="kpi-top">Stock alerts</div><strong>${t.low}</strong><div class="muted">Low or out of stock</div></div>`}
function stockBadge(p){const q=+p.qty||0;return q<=0?'<span class="badge bad">Out</span>':q<=(+p.min||0)?'<span class="badge warn">Low</span>':'<span class="badge good">OK</span>'}
function profitCells(p){const c=pcalc(p);return{unit:c.has?money(c.unit):"—",pct:c.has?c.pct.toFixed(1)+"%":"—",val:money(c.val),pot:c.has?money(c.pot):"—",cls:c.has?(c.unit>=0?"positive":"negative"):"muted"}}
function invRow(p){const c=profitCells(p),v=(p.variants||[]).map(x=>x[0]).join(" · ");return`<tr id="row-${p.id}" data-search="${esc((p.name+" "+p.cat+" "+(p.note||"")+" "+(p.expiry||"")).toLowerCase())}"><td><div style="display:flex;align-items:center"><img class="inv-thumb" src="${esc(productImage(p))}" alt="" onerror="this.style.display='none'"><div><div class="product-name">${esc(p.name)}</div><div class="sub">${esc(v||p.unit)}</div></div></div></td><td><input class="qe" type="number" min="0" step="1" value="${p.qty}" onchange="quickEdit('${p.id}','qty',this)"> <span class="c-badge">${stockBadge(p)}</span></td><td>${p.expiry?esc(p.expiry):"Not set"}<div class="sub">${exp(p.expiry)}</div></td><td><input class="qe" type="number" min="0" step=".01" value="${p.buy}" onchange="quickEdit('${p.id}','buy',this)"></td><td><input class="qe" type="number" min="0" step=".01" value="${p.sell}" onchange="quickEdit('${p.id}','sell',this)"></td><td class="c-unit ${c.cls}"><b>${c.unit}</b></td><td class="c-pct ${c.cls}">${c.pct}</td><td class="c-val">${c.val}</td><td class="c-pot ${c.cls}"><b>${c.pot}</b></td><td><button class="btn soft" onclick="openProduct('${p.id}')">Edit</button><button class="remove-btn" onclick="removeProduct('${p.id}')">Remove</button></td></tr>`}
function quickEdit(id,f,el){const p=product(id);if(!p)return;const v=Math.max(0,+el.value||0);p[f]=v;el.value=v;localStorage.setItem(KEY,JSON.stringify(db));const r=document.getElementById("row-"+id),c=profitCells(p);if(r){r.querySelector(".c-badge").innerHTML=stockBadge(p);for(const k of["unit","pct","pot"]){const td=r.querySelector(".c-"+k);td.className="c-"+k+" "+c.cls;td.innerHTML=k==="pct"?c[k]:"<b>"+c[k]+"</b>"}r.querySelector(".c-val").textContent=c.val}const k=document.getElementById("invKpis");if(k)k.innerHTML=invKpis()}
function inventory(){document.getElementById("inventory").innerHTML=`<div class="kpis" id="invKpis">${invKpis()}</div><div class="panel"><div class="toolbar"><input class="input search" id="invSearch" oninput="filterInv()" placeholder="Search liquor or beverage"><select class="select" id="invCat" onchange="filterInv()"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.cat))].sort().map(c=>`<option>${esc(c)}</option>`).join("")}</select><button class="btn soft" onclick="loadCatalog()">＋ Import website catalog</button><button class="btn primary" onclick="openProduct()">＋ Add product</button></div><div class="import-note" style="margin:0 0 12px">Edit Stock, CP (cost price) and SP (selling price) directly in the table. Profit and margin appear once CP is entered.</div><div class="table-wrap"><table id="invTable"><tr><th>Product</th><th>Stock</th><th>Expiry date / status</th><th title="Cost price (what you pay)">CP</th><th title="Selling price">SP</th><th>Profit / unit</th><th>Margin</th><th>Stock value (CP)</th><th>Potential profit</th><th></th></tr>${db.products.map(invRow).join("")||'<tr><td colspan="10" class="empty">No products yet. Add a product or import the website catalog.</td></tr>'}</table></div></div>`}
function filterInv(){let q=(document.getElementById("invSearch")?.value||"").toLowerCase(),c=document.getElementById("invCat")?.value||"";document.querySelectorAll("#invTable tr[data-search]").forEach(r=>r.style.display=r.dataset.search.includes(q)&&(c===""||r.dataset.search.includes(c.toLowerCase()))?"":"none")}
function openProduct(id){
  let p=product(id)||{id:"",name:"",cat:"Grocery",qty:0,buy:0,sell:0,min:5,expiry:"",unit:"pcs",note:"",image:"",variants:[]};
  const im=productImage(p);
  modal(`<h2>${id?"Edit product":"Add product"}</h2><div class="muted">Manage stock, prices, expiry and the product image.</div>
  <div class="form">
  <label>Product name<input id="pn" value="${esc(p.name)}"></label>
  <label>Category<input id="pc" value="${esc(p.cat)}"></label>
  <label>Current stock<input id="pq" type="number" min="0" value="${p.qty}"></label>
  <label>Unit<select id="pu">${["pcs","kg","litre","box","packet","dozen"].map(u=>`<option ${p.unit===u?"selected":""}>${u}</option>`).join("")}</select></label>
  <label>Purchase price<input id="pb" type="number" min="0" step=".01" value="${p.buy}"></label>
  <label>Selling price<input id="ps" type="number" min="0" step=".01" value="${p.sell}"></label>
  <label>Low-stock threshold<input id="pm" type="number" min="0" value="${p.min}"></label>
  <label>Expiry date<input id="pe" type="date" value="${p.expiry}"></label>
  <label>Image filename<input id="pimage" value="${esc(p.image||"")}" placeholder="coke.jpg"></label>
  <label>Upload product image<input id="pimageFile" type="file" accept="image/*" onchange="previewProductImage(event)"><img id="pimagePreview" class="img-preview" src="${esc(im)}" style="${im?'display:block':''}" alt=""></label>
  <label class="full">Brand / supplier / note<input id="pnote" value="${esc(p.note||"")}"></label></div>
  <div class="modal-actions"><button class="btn soft" onclick="closeModal()">Cancel</button>${id?`<button class="remove-btn" onclick="removeProduct('${id}')">Remove product</button>`:""}<button class="btn primary" onclick="saveProduct('${id||""}')">Save product</button></div>`)
}
async function previewProductImage(e){const f=e.target.files?.[0];if(!f)return;const u=await fileToDataURL(f),i=document.getElementById("pimagePreview");if(i){i.src=u;i.style.display="block"}}
async function saveProduct(id){
  const name=document.getElementById("pn").value.trim();if(!name)return alert("Product name is required.");
  const pid=id||crypto.randomUUID(),old=product(id);
  const p={id:pid,name,cat:document.getElementById("pc").value.trim()||"Other",qty:+document.getElementById("pq").value,buy:+document.getElementById("pb").value,sell:+document.getElementById("ps").value,min:+document.getElementById("pm").value,expiry:document.getElementById("pe").value,unit:document.getElementById("pu").value,note:document.getElementById("pnote").value.trim(),image:document.getElementById("pimage").value.trim(),variants:old?.variants||[]};
  const f=document.getElementById("pimageFile")?.files?.[0];if(f)saveStoredImage(pid,await fileToDataURL(f));
  const i=db.products.findIndex(x=>x.id===pid);if(i<0)db.products.push(p);else db.products[i]=p;closeModal();save()
}
function removeProduct(id){
  const p=product(id);if(!p)return;
  if(!confirm(`Remove "${p.name}" from inventory and POS?\n\nExisting sales records will remain.`))return;
  db.sales.forEach(x=>{if(x.pid===id&&!x.name)x.name=p.name});db.products=db.products.filter(x=>x.id!==id);deleteStoredImage(id);cart=cart.filter(x=>x.pid!==id);closeModal();save()
}

function pos(){document.getElementById("pos").innerHTML=`<div class="pos"><div class="panel"><div class="toolbar"><input class="input search" id="posSearch" oninput="renderPOSProducts()" placeholder="Search products to add to bill"><select class="select" id="posCat" onchange="renderPOSProducts()"><option value="">All categories</option>${[...new Set(db.products.map(p=>p.cat))].sort().map(c=>`<option>${esc(c)}</option>`).join("")}</select></div><div id="posProducts" class="products-grid"></div></div><div class="panel cart"><div class="panel-head"><h2>Current bill</h2><button class="btn soft" onclick="cart=[];renderAll()">Clear</button></div><div id="cartList"></div><div class="total-row"><span>Total</span><span id="cartTotal">${money(0)}</span></div><div style="margin-top:14px"><label class="muted">Payment method</label><select class="select" id="payMethod" style="width:100%;margin-top:6px"><option>Cash</option><option>eSewa</option><option>Khalti</option><option>Bank</option><option>Credit / Udhaar</option></select></div><button class="btn primary" style="width:100%;margin-top:13px" onclick="checkout()">Complete sale</button><div class="footer">Stock is automatically reduced when the sale is completed.</div></div></div>`;renderPOSProducts();renderCart()}
function renderPOSProducts(){let q=(document.getElementById("posSearch")?.value||"").toLowerCase(),c=document.getElementById("posCat")?.value||"",box=document.getElementById("posProducts");if(!box)return;box.innerHTML=db.products.filter(p=>String(p.name||"").toLowerCase().includes(q)&&(c===""||p.cat===c)).map(p=>`<div class="prod-card ${Number(p.qty)>0?"":"out-of-stock"}" ${Number(p.qty)>0?`onclick="addCart('${p.id}')"`:""}><img class="prod-thumb" src="${esc(productImage(p))}" alt="" onerror="this.style.display='none'"><div class="product-name">${esc(p.name)}</div><div class="prod-cat">${esc(p.cat)} · ${Number(p.qty)||0} ${esc(p.unit||"pcs")} available</div><div class="price">${money(p.sell)}${p.variants?.length?`<span class="variant-mini">${esc(p.variants.map(v=>v[0]).join(" · "))}</span>`:""}</div>${Number(p.qty)>0?"":'<div class="stock-warning">Out of stock — add quantity in Inventory</div>'}</div>`).join("")||'<div class="empty">No matching products. Import the website catalog from Inventory if needed.</div>'}
function addCart(id){let p=product(id),x=cart.find(a=>a.id===id);if(!p)return;if(Number(p.qty)<=0)return alert("This product is out of stock. Add its quantity in Inventory first.");if(x){if(x.qty<p.qty)x.qty++;else return alert("Not enough stock.")}else cart.push({id,qty:1});renderCart()}
function renderCart(){let box=document.getElementById("cartList");if(!box)return;let total=cart.reduce((a,x)=>a+product(x.id).sell*x.qty,0);box.innerHTML=cart.map(x=>{let p=product(x.id);return`<div class="cart-row"><div><b>${esc(p.name)}</b><div class="sub">${money(p.sell)} each</div></div><div class="qty"><button onclick="changeCart('${x.id}',-1)">−</button><b>${x.qty}</b><button onclick="changeCart('${x.id}',1)">+</button></div><b>${money(p.sell*x.qty)}</b></div>`}).join("")||'<div class="empty">Add products to start a bill.</div>';document.getElementById("cartTotal").textContent=money(total)}
function changeCart(id,d){let x=cart.find(a=>a.id===id),p=product(id);if(!x)return;x.qty+=d;if(x.qty>p.qty)x.qty=p.qty;if(x.qty<=0)cart=cart.filter(a=>a.id!==id);renderCart()}
function checkout(){
  if(!cart.length)return alert("Add at least one product.");
  let method=document.getElementById("payMethod").value;
  let customerId=null;
  if(method==="Credit / Udhaar"){
    let name=prompt("Customer name for this credit sale:");
    if(!name)return;
    let due=cart.reduce((a,x)=>a+product(x.id).sell*x.qty,0);
    let c=db.customers.find(x=>x.name.toLowerCase()===name.toLowerCase());
    if(c){c.due=(+c.due||0)+due;customerId=c.id}
    else{customerId=crypto.randomUUID();db.customers.push({id:customerId,name,phone:"",due})}
  }
  for(let x of cart){
    let p=product(x.id);
    p.qty-=x.qty;
    db.sales.push({id:crypto.randomUUID(),date:new Date().toISOString(),pid:p.id,name:p.name,qty:x.qty,buy:p.buy,sell:p.sell,method,customerId:method==="Credit / Udhaar"?customerId:null});
  }
  cart=[];save();alert("Sale completed successfully.");showPage("sales")
}
function openSale(){showPage("pos")}
function sales(){document.getElementById("sales").innerHTML=`<div class="panel"><div class="panel-head"><h2>Sales history</h2><span class="muted">${db.sales.length} transactions</span></div><div class="table-wrap"><table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Revenue</th><th>Gross profit</th><th>Payment</th><th>Action</th></tr>${db.sales.slice().reverse().map(s=>`<tr><td>${new Date(s.date).toLocaleString()}</td><td class="product-name">${esc(product(s.pid)?.name||s.name||"Old product (removed)")}</td><td>${s.qty}</td><td>${money(s.qty*s.sell)}</td><td class="positive">${money(s.qty*(s.sell-s.buy))}</td><td>${esc(s.method)}</td><td><button class="remove-btn" onclick="deleteSale('${s.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="7" class="empty">No sales recorded.</td></tr>'}</table></div><div class="footer">Deleting a sale restores its quantity to stock and updates sales/profit totals. Credit sales also reduce the linked customer's due.</div></div>`}
function deleteSale(id){
  const s=db.sales.find(x=>x.id===id);
  if(!s)return;
  const p=db.products.find(x=>x.id===s.pid);
  if(!p)return alert("This product is no longer in Inventory, so its stock cannot be restored. Add the product back first, then delete this sale.");
  let customer=null;
  if(s.method==="Credit / Udhaar"){
    customer=db.customers.find(c=>c.id===s.customerId);
    if(!customer)return alert("This older credit sale is not linked to a customer record. To avoid changing the wrong customer's due, this sale cannot be deleted automatically. Please adjust the customer's due manually first.");
  }
  const amount=(+s.qty||0)*(+s.sell||0);
  if(!confirm("Delete this sale?\n\nThe sold quantity will be returned to Inventory and sales/profit totals will be recalculated."+(customer?"\nThe customer's due will also be reduced by "+money(amount)+".":"")+"\n\nThis cannot be undone."))return;
  p.qty=(+p.qty||0)+(+s.qty||0);
  if(customer)customer.due=Math.max(0,(+customer.due||0)-amount);
  db.sales=db.sales.filter(x=>x.id!==id);
  save();
}
function customers(){document.getElementById("customers").innerHTML=`<div class="panel"><div class="panel-head"><h2>Customers & outstanding dues</h2><button class="btn primary" onclick="addCustomer()">＋ Add customer</button></div><div class="table-wrap"><table><tr><th>Customer</th><th>Phone</th><th>Outstanding</th><th></th></tr>${db.customers.map(c=>`<tr><td class="product-name">${esc(c.name)}</td><td>${esc(c.phone)}</td><td class="${c.due>0?'negative':'positive'}"><b>${money(c.due)}</b></td><td><button class="btn soft" onclick="payDue('${c.id}')">Record payment</button></td></tr>`).join("")||'<tr><td colspan="4" class="empty">No customer accounts yet.</td></tr>'}</table></div></div>`}
function addCustomer(){modal(`<h2>Add customer</h2><div class="form"><label>Customer name<input id="cn" placeholder="Full name"></label><label>Phone number<input id="cp" placeholder="98XXXXXXXX"></label></div><div class="modal-actions"><button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveCustomer()">Save customer</button></div>`)}
function saveCustomer(){let n=document.getElementById("cn").value.trim();if(!n)return;db.customers.push({id:crypto.randomUUID(),name:n,phone:document.getElementById("cp").value.trim(),due:0});closeModal();save()}
function payDue(id){let c=db.customers.find(x=>x.id===id),a=+prompt("Payment received from "+c.name+" (Rs.)",c.due);if(a>0){c.due=Math.max(0,c.due-a);save()}}
function reports(){let s=stats(),by={};db.sales.forEach(x=>{let d=new Date(x.date).toLocaleDateString();by[d]=(by[d]||0)+x.qty*x.sell});document.getElementById("reports").innerHTML=`<div class="kpis"><div class="kpi"><div class="kpi-top">Revenue</div><strong>${money(s.rev)}</strong></div><div class="kpi"><div class="kpi-top">Cost of goods</div><strong>${money(s.cost)}</strong></div><div class="kpi"><div class="kpi-top">Expenses</div><strong>${money(s.ex)}</strong></div><div class="kpi"><div class="kpi-top">Net profit / loss</div><strong class="${s.profit>=0?'positive':'negative'}">${money(s.profit)}</strong></div></div><div class="content-grid"><div class="panel"><div class="panel-head"><h2>Daily sales</h2></div><div class="table-wrap"><table><tr><th>Date</th><th>Revenue</th></tr>${Object.entries(by).reverse().map(([d,v])=>`<tr><td>${d}</td><td>${money(v)}</td></tr>`).join("")||'<tr><td colspan="2" class="empty">No sales yet.</td></tr>'}</table></div></div><div class="panel"><div class="panel-head"><h2>Expenses</h2><button class="btn primary" onclick="addExpense()">＋ Expense</button></div>${db.expenses.slice().reverse().map(e=>`<div class="statline"><span>${esc(e.name)}<div class="sub">${new Date(e.date).toLocaleDateString()}</div></span><b>${money(e.amount)}</b></div>`).join("")||'<div class="empty">No expenses recorded.</div>'}</div></div>`}
function addExpense(){modal(`<h2>Record expense</h2><div class="form"><label>Description<input id="en" placeholder="Electricity, transport, rent..."></label><label>Amount<input id="ea" type="number" min="0" step=".01"></label></div><div class="modal-actions"><button class="btn soft" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveExpense()">Save expense</button></div>`)}
function saveExpense(){let n=document.getElementById("en").value.trim(),a=+document.getElementById("ea").value;if(!n||a<=0)return;db.expenses.push({id:crypto.randomUUID(),date:new Date().toISOString(),name:n,amount:a});closeModal();save()}
function settings(){document.getElementById("settings").innerHTML=`<div class="panel"><div class="panel-head"><h2>Data & backup</h2></div><div class="import-note">Website catalog imported: product names, selling prices, image filenames and size/variant labels come directly from your original index.html. Newly imported products start at 0 stock and 0 cost. Existing stock quantities are preserved; check them against your real shop stock before selling.</div><div class="notice">Grocerify works offline. Your data is stored in this browser on this device. Export a backup regularly.</div><div class="actions"><button class="btn primary" onclick="backup()">Export backup</button><button class="btn soft" onclick="document.getElementById('restore').click()">Restore backup</button><button class="btn soft" onclick="loadCatalog()">Import website catalog</button><button class="btn soft" onclick="clearOldSales()">Clear old removed-product sales</button><button class="btn danger" onclick="resetData()">Reset all data</button></div><input id="restore" type="file" accept=".json" class="hidden" onchange="restoreData(event)"></div><div class="panel" style="margin-top:14px"><div class="panel-head"><h2>Store summary</h2></div><div class="statline"><span>Products</span><b>${db.products.length}</b></div><div class="statline"><span>Customer accounts</span><b>${db.customers.length}</b></div><div class="statline"><span>Transactions</span><b>${db.sales.length}</b></div><div class="statline"><span>Total outstanding due</span><b class="negative">${money(db.customers.reduce((a,c)=>a+c.due,0))}</b></div></div>`}
function clearOldSales(){const ids=new Set(db.products.map(p=>p.id)),old=db.sales.filter(x=>!ids.has(x.pid)&&!x.name);if(!old.length)return alert("No old removed-product sales found.");const amt=old.reduce((a,x)=>a+x.qty*x.sell,0);if(!confirm(`Delete ${old.length} old sales of removed products (total ${money(amt)})?\n\nThis lowers your revenue and profit totals. It cannot be undone — export a backup first if unsure.`))return;db.sales=db.sales.filter(x=>ids.has(x.pid)||x.name);save()}
function backup(){let b=new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="grocerify-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()}function restoreData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.products||!x.sales)throw 0;db=x;save();alert("Backup restored successfully.")}catch{alert("Invalid Grocerify backup file.")}};r.readAsText(f)}function resetData(){if(confirm("This will permanently remove all Grocerify data stored in this browser. Continue?")){db={products:[],sales:[],customers:[],expenses:[]};save()}}function modal(x){document.getElementById("modalBox").innerHTML=x;document.getElementById("modal").classList.add("show")}function closeModal(){document.getElementById("modal").classList.remove("show")}document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};document.getElementById("dateLine").textContent=new Date().toLocaleString("en-NP",{dateStyle:"full",timeStyle:"short"});// Safe startup: do not automatically delete products or overwrite stock quantities.
// The old keepLiquorOnly/applyStockSheet routines are intentionally not run.
if(!db.products.length){loadCatalog(false)}else{renderAll()}
</script>
</body>
